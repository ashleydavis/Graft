name: Root cause macOS arm64 file-path-menu

# Experiment only, not part of Graft's CI. It reruns the file-path-menu smoke test on the runner that
# failed in Release macOS arm64 run 45815238348: 20 runs of the test as it is on the failing commit,
# then 20 runs with only a wait for the changes pane's row added before the click. A run is triggered
# only when this file changes, so later commits on the experiment branch do not run it again.

on:
  push:
    branches:
      - "tmp-root-cause-macos-arm64-file-path-menu"
    paths:
      - ".github/workflows/root-cause-macos-arm64-file-path-menu.yml"

jobs:
  repro:
    timeout-minutes: 120
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"

      - name: Setup Zig and jq (versions from mise.toml)
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
        with:
          install_args: zig jq

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Build the app once
        shell: bash
        run: bun run build:macos --configuration Release --native-dir "$PWD/build/native" --build-dir "$PWD/build/xcode"

      - name: Phase A, the test as it failed, 20 runs
        shell: bash
        run: |
          passed=0
          failed=0
          for i in $(seq 1 20); do
            echo "A run $i started at $(date -u +%H:%M:%S)"
            if ZIGGY_SMOKE_BUILD="$PWD/build" bash smoke-tests/run-desktop.sh file-path-menu > "run-a-$i.log" 2>&1; then
              passed=$((passed + 1))
              echo "A run $i PASSED at $(date -u +%H:%M:%S)"
            else
              failed=$((failed + 1))
              echo "A run $i FAILED at $(date -u +%H:%M:%S)"
              grep -E "^FAILED" "run-a-$i.log" | head -3 || true
            fi
          done
          echo "PHASE A: passed $passed, failed $failed of 20"

      - name: Phase B, only a wait for the changes row added, 20 runs
        shell: bash
        run: |
          cp root-cause/experiments/test-with-row-wait.sh smoke-tests/file-path-menu/test.sh
          passed=0
          failed=0
          for i in $(seq 1 20); do
            echo "B run $i started at $(date -u +%H:%M:%S)"
            if ZIGGY_SMOKE_BUILD="$PWD/build" bash smoke-tests/run-desktop.sh file-path-menu > "run-b-$i.log" 2>&1; then
              passed=$((passed + 1))
              echo "B run $i PASSED at $(date -u +%H:%M:%S)"
            else
              failed=$((failed + 1))
              echo "B run $i FAILED at $(date -u +%H:%M:%S)"
              grep -E "^FAILED" "run-b-$i.log" | head -3 || true
            fi
          done
          echo "PHASE B: passed $passed, failed $failed of 20"
