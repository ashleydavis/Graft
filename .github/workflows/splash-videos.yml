name: Splash videos

# Builds Graft on Linux, Windows and macOS, starts it and records the screen from before it opens until after its splash screen
# has faded out, then uploads each video, kept for 3 days, to check the splash frame by frame. It is started by hand only. The
# recording is scripts/record-splash.sh (see record-splash.md).

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

on:
  push:

  workflow_dispatch:

jobs:
  splash-video-linux:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Install the web view's runtime libraries, the display and the recorder (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 gstreamer1.0-plugins-good gstreamer1.0-libav xvfb ffmpeg
          verify: Xvfb ffmpeg

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Build
        shell: bash
        run: bun run build:linux --prefix "$PWD/splash-build"

      - name: Record the splash
        shell: bash
        run: bash scripts/record-splash.sh --platform linux --app "$PWD/splash-build/bin/graft" --output "$PWD/splash-videos/graft-linux.mp4"

      - name: Upload the video
        uses: actions/upload-artifact@v4
        with:
          name: splash-video-linux
          path: splash-videos/graft-linux.mp4
          retention-days: 3
          if-no-files-found: error

  splash-video-windows:
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      # ffmpeg comes from a GitHub release, not Chocolatey, whose ffmpeg package stopped resolving from the Windows runners. The
      # `latest` release is used because the dated autobuild tags are deleted upstream after about two weeks.
      - name: Install the recorder (Windows)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=ffmpeg-n8.1-latest-win64-gpl-8.1.zip
          gh release download latest --repo BtbN/FFmpeg-Builds --pattern "$asset" --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/ffmpeg"
          dirname "$(find "$RUNNER_TEMP/ffmpeg" -name ffmpeg.exe -type f | head -1)" >> "$GITHUB_PATH"

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Fetch the WebView2 SDK and the WiX Toolset (Windows)
        shell: bash
        run: bun run setup

      # The Windows tools take a Windows path, which cygpath gives.
      - name: Build
        shell: bash
        run: bun run build:windows --prefix "$(cygpath -m "$PWD")/splash-build"

      - name: Record the splash
        shell: bash
        run: bash scripts/record-splash.sh --platform windows --app "$PWD/splash-build/graft/graft.exe" --output "$PWD/splash-videos/graft-windows.mp4"

      - name: Upload the video
        uses: actions/upload-artifact@v4
        with:
          name: splash-video-windows
          path: splash-videos/graft-windows.mp4
          retention-days: 3
          if-no-files-found: error

  splash-video-macos:
    timeout-minutes: 45
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@v2
        with:
          install_args: zig jq

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Build
        shell: bash
        run: bun run build:macos --configuration Release --native-dir "$PWD/splash-build/native" --build-dir "$PWD/splash-build/xcode"

      - name: Record the splash
        shell: bash
        run: bash scripts/record-splash.sh --platform macos --app "$PWD/splash-build/xcode/Build/Products/Release/Graft.app" --output "$PWD/splash-videos/graft-macos.mov"

      - name: Upload the video
        uses: actions/upload-artifact@v4
        with:
          name: splash-video-macos
          path: splash-videos/graft-macos.mov
          retention-days: 3
          if-no-files-found: error
