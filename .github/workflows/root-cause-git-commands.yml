name: Root cause git-commands

# Experiment only, not part of Graft's CI. It reruns the git-commands smoke test on the runner that
# failed in Release Linux run 45764726375: 20 runs with the test's original fixed order assertions,
# then 20 runs with only those assertions changed to accept either order. A run is triggered only
# when this file changes, so later commits on the experiment branch do not run it again.

on:
  push:
    branches:
      - "tmp-root-cause-git-commands"
    paths:
      - ".github/workflows/root-cause-git-commands.yml"

jobs:
  repro:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Setup Zig (version from mise.toml)
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
        with:
          install_args: zig jq

      - name: Install the web view's runtime libraries and the display tools (Linux)
        uses: ./.github/actions/install-apt-packages
        with:
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 gstreamer1.0-plugins-good gstreamer1.0-libav xvfb x11-utils
          verify: xvfb-run xwininfo

      - name: Install dependencies
        uses: ./.github/actions/retry-install
        with:
          run: bun install

      - name: Build the app once
        shell: bash
        run: bun run build:linux --prefix "$PWD/build"

      - name: Phase A, the test's original fixed order, 20 runs
        shell: bash
        run: |
          cp root-cause/experiments/test-fixed-order.sh smoke-tests/git-commands/test.sh
          passed=0
          failed=0
          for i in $(seq 1 20); do
            if ZIGGY_SMOKE_BUILD="$PWD/build" bash smoke-tests/run-desktop.sh git-commands > "run-a-$i.log" 2>&1; then
              passed=$((passed + 1))
              echo "A run $i PASSED"
            else
              failed=$((failed + 1))
              echo "A run $i FAILED"
              grep -E "^FAILED" "run-a-$i.log" | head -3 || true
            fi
          done
          echo "PHASE A: passed $passed, failed $failed of 20"

      - name: Phase B, only the order assertion changed, 20 runs
        shell: bash
        run: |
          cp root-cause/experiments/test-either-order.sh smoke-tests/git-commands/test.sh
          passed=0
          failed=0
          for i in $(seq 1 20); do
            if ZIGGY_SMOKE_BUILD="$PWD/build" bash smoke-tests/run-desktop.sh git-commands > "run-b-$i.log" 2>&1; then
              passed=$((passed + 1))
              echo "B run $i PASSED"
            else
              failed=$((failed + 1))
              echo "B run $i FAILED"
              grep -E "^FAILED" "run-b-$i.log" | head -3 || true
            fi
          done
          echo "PHASE B: passed $passed, failed $failed of 20"
